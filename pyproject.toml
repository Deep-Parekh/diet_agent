[project]
name = "dietva"
version = "0.1.0"
description = "A conversational diet-planning agent using LangChain + LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.12.0",
    "ddgs>=1.0.7",
    "gradio>=5.23.1",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "langchain>=1.1.2",
    "langchain-community>=0.4.1",
    "langchain-core>=1.1.1",
    "langchain-huggingface>=1.1.0",
    "langchain-ollama>=1.0.0",
    "langgraph>=1.0.4",
    "nbconvert>=7.16.6",
    "playwright>=1.57.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "sentencepiece>=0.2.1",
    "tabulate>=0.9.0",
    "torch>=2.9.1",
    "transformers>=4.57.3",
]
